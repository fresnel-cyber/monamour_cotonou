<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-label="Burger signature">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B2A20"/>
      <stop offset="100%" stop-color="#C1653D"/>
    </linearGradient>
    <pattern id="p" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none"/>
      <circle cx="20" cy="20" r="1.2" fill="#F7F2EA" opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="1000" height="1000" fill="url(#g)"/>
  <rect width="1000" height="1000" fill="url(#p)"/>
  <text x="50%" y="46%" text-anchor="middle" font-family="Georgia, serif" font-size="45" fill="#F7F2EA" opacity="0.9">Photo à remplacer</text>
  <text x="50%" y="54%" text-anchor="middle" font-family="sans-serif" font-size="29" fill="#F7F2EA" opacity="0.75">Burger signature</text>
